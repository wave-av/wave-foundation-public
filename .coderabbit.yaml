# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# CodeRabbit base configuration (generic). Derived from an internal WAVE repo with all
# WAVE-specific custom_checks/path_instructions/refs stripped. Consumers add their own
# path_instructions + custom_checks on top. Docs: https://docs.coderabbit.ai
language: en-US

reviews:
  auto_review:
    enabled: true
    # Trunk only. The default branch is ALWAYS reviewed and this key only ADDS bases; its values
    # are unanchored regexes, so the old `main` entry also matched any base containing "main"
    # (e.g. stacked PRs into fix/domain-*). master/develop/release/hotfix had zero PRs in the last
    # 200 (measured 2026-09-22). Empty = review PRs into the default branch and nothing else.
    base_branches: []
    # Bot-authored PRs are skipped silently and this wins over labels and `enabled`
    # (docs.coderabbit.ai/configuration/auto-review). Exact, case-sensitive logins taken from this
    # org's PR authors. The agent fleet authors as a HUMAN account and is NOT listed: skipping it
    # would remove CodeRabbit from every PR the merge gate scores.
    ignore_usernames:
      - "dependabot[bot]"
      - "renovate[bot]"
      - "github-actions[bot]"
      - "devin-ai-integration[bot]"
      - "cursor[bot]"
      - "wave-av-release-bot[bot]"
    ignore_title_keywords:
      - "WIP"
      - "DO NOT MERGE"
      - "[DRAFT]"
      - "[SKIP CI]"
    drafts: false
    # INCREMENTAL ONLY (reversed 2026-09-22). Each push reviews "the commits added since the last
    # review", not the whole PR. `false` left the head SHA with the status "Review skipped:
    # incremental reviews are disabled" (measured on a private fleet repo's PR), which the merge gate
    # (private-repo review-liveness) scores as CodeRabbit did-not-run. Pausing does the same,
    # so pausing is off. NOTE: the wave-av org Global Override pins these two keys to false/1 and
    # supersedes this file until the operator removes them there.
    auto_incremental_review: true
    auto_pause_after_reviewed_commits: 0
    # Opt-out for throwaway/ephemeral PRs only: apply the `skip-review` label to skip
    # (negative match; PRs without it are unaffected — real PRs keep full coverage).
    labels:
      - "!skip-review"

  # ── auto_approve was REMOVED (inert) ──────────────────────────────────────
  # `auto_approve` is not a key in CodeRabbit's live v2 schema
  # (storage.googleapis.com/coderabbit_public_assets/schema.v2.json, verified 2026-08-02),
  # so the block that used to sit here never did anything. It did NOT satisfy branch
  # protection, and removing it changes no behaviour. CodeRabbit's unearned approvals are
  # vendor-side and no key in this file disables them — handle that with branch protection
  # requiring a human/CODEOWNERS review, not with config here.

  review_status: true
  request_changes_workflow: false
  profile: chill
  high_level_summary: true
  high_level_summary_placeholder: "@coderabbitai summary"
  poem: false
  collapse_walkthrough: true
  changed_files_summary: true
  sequence_diagrams: true

  path_filters:
    - "!**/*.lock"
    - "!**/generated/**"
    - "!**/node_modules/**"
    - "!**/dist/**"
    - "!**/build/**"
    - "!**/out/**"
    - "!**/coverage/**"
    - "!**/__snapshots__/**"
    - "!**/*.snap"
    - "!**/*.generated.*"
    - "!**/*.lockb"
    - "!package-lock.json"
    - "!pnpm-lock.yaml"
    - "!yarn.lock"
    - "!**/*.min.js"
    - "!**/*.min.css"
    - "!**/*.png"
    - "!**/*.jpg"
    - "!**/*.svg"
    - "!**/*.woff2"
    - "!**/*.mp4"

  # Four standing rules, stated in plain English so a reviewer can apply them to any matching file.
  # Each came from a defect class this fleet has shipped before; flag a violation as a real bug.
  path_instructions:
    - path: "**/*.{ts,tsx,js,mjs,cjs}"
      instructions: |
        Money-moving endpoints must verify org ownership of addresses. Any handler that sends,
        pays, refunds, withdraws, settles or otherwise moves funds must first confirm that the
        caller's organization owns the source address, wallet, account or payout destination it
        acts on. Checking that the caller is logged in is not enough. Flag any money-moving path
        where the address comes from the request and is used before that ownership check.
    - path: "**/*.{ts,tsx,js,mjs,cjs}"
      instructions: |
        Secrets must only be forwarded to https allowlisted URLs. When code sends a secret (an API
        key, token, signing secret, cookie or Authorization header) in an outbound request, the
        destination must use https and must match a fixed allowlist of hosts. Flag any secret sent
        to a URL built from user input, config the caller controls, or plain http.
    - path: "**/*.{ts,tsx,js,mjs,cjs}"
      instructions: |
        Durable Object multi-statement writes go in a transaction. Inside a Durable Object, two or
        more writes that must succeed or fail together (storage.put/delete pairs, or several SQL
        statements) must run in one transaction, such as ctx.storage.transaction() or
        transactionSync(). Flag related writes that run as separate calls, where a failure or
        eviction between them would leave state half-written.
    - path: "**/*.{ts,tsx,js,mjs,cjs}"
      instructions: |
        No silent error swallowing in Workers. In Cloudflare Worker code, a catch block, .catch()
        handler or Promise.allSettled result must log the error, rethrow it, or return an error
        response. Flag an empty catch, a catch that only returns a default value, and a waitUntil
        or background promise whose failure nobody observes.

  labeling_instructions:
    - label: "security"
      instructions: "Apply when changes affect authentication, authorization, secrets, or security headers."
    - label: "breaking-change"
      instructions: "Apply when changes break backward compatibility or require client updates."
    - label: "size/M"
      instructions: "Apply when PR has 50-200 lines changed."
    - label: "size/L"
      instructions: "Apply when PR has 200-500 lines changed."
    - label: "size/XL"
      instructions: "Apply when PR has >500 lines changed."

  # Open-source analyzers CodeRabbit runs as part of review.
  tools:
    gitleaks:
      enabled: true
    semgrep:
      enabled: true
    # The schema key is `osvScanner`, camelCase. This read `osv-scanner` since the file was
    # written; `tools` allows additional properties, so CodeRabbit accepted the misspelling
    # silently and ran no OSV scanning at all. Verified against the live v2 schema
    # (storage.googleapis.com/coderabbit_public_assets/schema.v2.json, 2026-08-06): the 57 tool
    # keys include `osvScanner` and do not include `osv-scanner`. (#1083)
    osvScanner:
      enabled: true
    shellcheck:
      enabled: true
    yamllint:
      enabled: true
    markdownlint:
      enabled: true
    actionlint:
      enabled: true
    ruff:
      enabled: true
    ast-grep:
      enabled: true
      packages:
        - "ast-grep-essentials"
    # Same misspelling class as `osvScanner` above: the schema key is `github-checks`,
    # hyphenated, not `github_checks`. Verified against the same live v2 schema dump
    # (2026-08-06); the snake_case key was silently ignored, so this block was inert.
    github-checks:
      enabled: true
      timeout_ms: 900000

knowledge_base:
  code_guidelines:
    enabled: true
  learnings:
    scope: auto
