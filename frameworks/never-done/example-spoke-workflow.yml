# Spoke adoption: paste THIS into `.github/workflows/never-done.yml` of any consuming repo —
# but read this note first, it is not plug-and-play.
#
# NOT SHIPPED HERE: the hub reusable workflow this spoke calls
# (`never-done.yml`, `on: workflow_call`) is not included anywhere in this
# public repository — only this spoke template and the vendored
# `generate-comment.sh` / `post-comment.sh` scripts are. A `uses:` pointing
# at a repo you don't control and can't reach will never resolve for you
# (the run fails before any job is created). To use this spoke you must
# supply your own hub workflow: write one implementing the same contract
# (call `generate-comment.sh` + `post-comment.sh`, see README.md), publish
# it in a repo you control, and point `uses:` below at that repo/ref.
#
# The grant of `pull-requests: write` is REQUIRED for the comment poster — a reusable
# workflow cannot elevate permissions the caller didn't grant.
#
# Advisory only (`continue-on-error: true` is set on the hub-side job).
# See frameworks/never-done/README.md for the standing principle.

name: Never-Done audit invitation

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  audit:
    # Replace with a hub workflow you control — see the NOT SHIPPED HERE note above.
    uses: <your-org>/<your-hub-repo>/.github/workflows/never-done.yml@<ref>
    permissions:
      contents: read
      pull-requests: write
