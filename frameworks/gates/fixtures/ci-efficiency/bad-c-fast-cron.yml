name: bad-c-fast-cron
# FAST-CRON, isolated: a 30-minute cron on a CHEAP runner with no PR/push trigger, so the
# only finding must be the sub-hour cron itself.
on:
  schedule:
    - cron: "*/30 * * * *"
concurrency:
  group: bad-c-fast-cron
  cancel-in-progress: false
jobs:
  sweep:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - run: echo fast
