name: good-cron-hourly
# FAST-CRON negative case: a single minute value fires at most once per hour, which is
# exactly the allowed interval (17 * * * * = hourly at :17).
on:
  schedule:
    - cron: "17 * * * *"
concurrency:
  group: good-cron-hourly
  cancel-in-progress: false
jobs:
  sweep:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - run: echo hourly
