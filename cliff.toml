# git-cliff — generate CHANGELOG.md from Conventional Commit history.
# Fits wave-foundation: no package.json, consumed by tag/SHA pin, commits already conventional
# (enforced by semantic-pr.yml). Changesets is NOT used here (it's for npm-publishing repos). Run:
# git cliff -o CHANGELOG.md
[changelog]
header = "# Changelog\n\nAll notable changes to wave-foundation. Consumed by tag/SHA pin.\n"
body = """
{% if version %}
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}
## [unreleased]
{% endif %}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}
{% for commit in commits %}
- {{ commit.message | upper_first }} ({{ commit.id | truncate(length=7, end="") }})
{% endfor %}
{% endfor %}\n
"""
trim = true
# Collapse the blank-line runs the loops emit so the output is markdownlint-clean (MD012).
postprocessors = [{ pattern = '\n{3,}', replace = "\n\n" }]

[git]
conventional_commits = true
filter_unconventional = false
commit_parsers = [
  { message = "^Merge ", skip = true },
  { message = "^feat", group = "Features" },
  { message = "^fix", group = "Bug Fixes" },
  { message = "^docs", group = "Documentation" },
  { message = "^refactor", group = "Refactor" },
  { message = "^perf", group = "Performance" },
  { message = "^test", group = "Testing" },
  { message = "^ci", group = "CI/CD" },
  { message = "^chore", skip = true },
  { message = ".*", group = "Other" },
]
# Every release-tag FAMILY in this repo, not just the top-level one. a835497b narrowed this to
# `^v[0-9]+\.[0-9]+\.[0-9]+$` to "scope git-cliff to semver release tags", and the effect was that
# git-cliff stopped seeing the `spoke-chassis-vX.Y.Z` and `content-hash-vX.Y.Z` tags as version
# boundaries at all. Since `-o` rewrites the whole file from what it can see, those 43 sections
# became unreproducible: the very next cut (v1.12.0, same day) wrote a CHANGELOG without them.
#
# Measured on a fully-tagged checkout: the narrow pattern emits 23 sections, this one emits 66 —
# exactly the number the file actually has. Narrowing what a GENERATOR can see silently narrows
# what it will KEEP, because regeneration is not additive.
# The X.Y.Z shape is required so this does NOT match the moving major tag `v1`, which would
# otherwise produce a bogus `## [1]` section covering the entire history.
tag_pattern = "(v|[a-z-]+-v)[0-9]+\\.[0-9]+\\.[0-9]+$"
sort_commits = "oldest"
