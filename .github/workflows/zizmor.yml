name: zizmor (Actions security)

# Static security analysis of GitHub Actions workflows (template injection, spoofable actor
# checks, credential persistence, over-broad tokens). Run as a CLI gate (fails on findings) —
# no SARIF/code-scanning upload, which isn't available on private repos without Advanced Security.
# Accepted by-design findings are suppressed in .github/zizmor.yml (auto-discovered).

on:
  push:
    branches: [master, main]
  pull_request:
  merge_group: # required check (zizmor) — must run on the merge-queue group

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  zizmor:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"
      - run: pip install zizmor==1.25.2
      - name: Audit workflows
        env:
          GH_TOKEN: ${{ github.token }} # enables online audits (known-vulnerable actions via GHSA)
        run: zizmor .github/workflows/
