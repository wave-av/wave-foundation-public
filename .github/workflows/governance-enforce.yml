name: governance-enforce

# A_BLOCK gate: no-secrets-in-git / secrets-from-doppler / no-hardcoded-paths, enforced on the
# PR diff via the @wave-av/governance package. Diff-scoped: blocks NEW violations only.
# Actions SHA-pinned (pinact/zizmor): tags kept in trailing comments.
#
# STATUS NOTE (2026-09-21): every run of this job has been failing WITHOUT EXECUTING since
# 2026-09-20T06:28Z — annotation "The job was not started because your account is locked due to
# a billing issue." This job runs on ubuntu-latest (GitHub-hosted), and the org's Actions
# spending cap denies runners to ubuntu-latest jobs, including on this public repo (job-level
# starvation — distinct from the run-level `startup_failure` that private repos see; see PR #98's
# two-layer writeup). It is NOT a defect in this workflow: the exact same logic ran green
# repeatedly through 2026-09-08T23:37Z. PR #98 deliberately left this job on ubuntu-latest rather
# than moving it to Blacksmith, because it sets NODE_AUTH_TOKEN from secrets.GITHUB_TOKEN and
# self-check.yml (the only other blacksmith-hosted workflow here) references no secrets at all —
# no in-repo precedent for a secret-bearing job on a third-party runner, so it was treated
# conservatively. That call is not superseded here. Don't attribute a new failure to this file
# without first re-running PAST the cap: `gh pr update-branch` or a fresh push, never
# `gh run rerun` (it replays the old workflow definition and proves nothing about a file change).

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read
  packages: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  enforce:
    runs-on: ubuntu-latest
    env:
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
      - name: fetch governance enforcer (isolated install)
        run: |
          mkdir -p "$RUNNER_TEMP/gov" && cd "$RUNNER_TEMP/gov"
          printf '@wave-av:registry=https://npm.pkg.github.com\n//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}\n' > .npmrc
          npm install @wave-av/governance@^0.4.4 --no-save --no-audit --no-fund
      - name: A_BLOCK enforce (secrets + hardcoded paths on the diff)
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          BASE="${PR_BASE_SHA:-$PUSH_BEFORE_SHA}"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            BASE=$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)
          fi
          echo "diffing against $BASE"
          node "$RUNNER_TEMP/gov/node_modules/@wave-av/governance/bin/enforce.mjs" --changed "$BASE"
