name: governance-enforce

# A_BLOCK gate: no-secrets-in-git / secrets-from-doppler / no-hardcoded-paths, enforced on the
# PR diff via the @wave-av/governance package (the org fan-out channel). Diff-scoped: blocks NEW
# violations without failing on legacy debt. Isolated install bypasses any min-release-age policy.
# The org ruleset `governance-a-block-enforce` requires this job's `enforce` check.

on:
  pull_request:
  merge_group:
  push:
    branches: [main, master]
  workflow_call: {}

# #174 cost fix: cancel superseded PR runs (rapid re-pushes on the same PR) instead of letting each
# run to completion. Scoped so a required run is NEVER cancelled: cancel-in-progress is gated to
# pull_request events only — push:main and merge_group runs (the org-ruleset-required `enforce`
# check) always run to completion, so a cancelled run can never block the merge queue or leave a
# required check unresolved.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: read

jobs:
  enforce:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    env:
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: fetch governance enforcer (isolated install)
        run: |
          mkdir -p "$RUNNER_TEMP/gov" && cd "$RUNNER_TEMP/gov"
          printf '@wave-av:registry=https://npm.pkg.github.com\n//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}\n' > .npmrc
          # --ignore-scripts: the registry token is set for this step and the range plus its public deps float,
          # so no package lifecycle script may run while the token is present (the enforcer is plain ESM and
          # needs no install script). A null global npmrc keeps runner-image npm config out of this one call.
          NPM_CONFIG_GLOBALCONFIG=/dev/null npm install @wave-av/governance@^0.4.4 --ignore-scripts --no-save --no-audit --no-fund
      - name: A_BLOCK enforce (secrets + hardcoded paths on the diff)
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          MERGE_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          BASE="${PR_BASE_SHA:-${MERGE_BASE_SHA:-$PUSH_BEFORE_SHA}}"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            # Indeterminate base (first push / force-push). Do NOT silently scan a partial range —
            # HEAD~1 would skip earlier commits in a multi-commit push and let a violation through
            # (a config-no-silent-noop hole). Diff the full tree against git's empty-tree object so
            # every introduced file is scanned; loud, never a silent empty/partial pass.
            BASE=$(git hash-object -t tree /dev/null)
            echo "::warning::indeterminate diff base; scanning full tree (empty-tree base) so no commit is skipped"
          fi
          echo "diffing against $BASE"
          node "$RUNNER_TEMP/gov/node_modules/@wave-av/governance/bin/enforce.mjs" --changed "$BASE"
