name: Bot Review Gate

# Lightweight API-only check that classifies bot findings and sets a commit status.
# No checkout needed — runs in <30s using only GitHub API calls. Recognizes CodeRabbit,
# Cursor, Greptile, Cubic, Sentry, GitHub Advanced Security, etc. Harvested from
# an internal WAVE repo and genericized. Register as a NON-required check first; after
# validating, add "Bot Review Gate" to branch protection.
#
# ORCHESTRATOR ONLY (decomposed 2026-09-01, widened to four sub-workflows 2026-09-01 when the
# liveness classifier landed — rules/file-size-limits.md is LAW: DECOMPOSE, never trim comments/
# context to fit the token-budget gate's ~21600-byte cap). Chains four same-repo reusable workflows
# via `needs:` + `uses: ./.github/workflows/...`, which resolves within the SAME checkout/ref
# GitHub already fetched to run this file — zero extra permissions, identical behaviour for every
# consumer:
#   resolve  (bot-review-gate-resolve.yml)  — derive PR/head SHA, best-effort auto-resolve
#     addressed (outdated) bot review threads.
#   tally    (bot-review-gate-tally.yml)    — classify findings by severity.
#   liveness (bot-review-gate-liveness.yml) — classify each required bot's LIVENESS (did it
#     demonstrably RUN, or only publish a non-failing status while stating it did not —
#     wave-foundation#1346), fetch the head commit's timestamp.
#   verdict  (bot-review-gate-verdict.yml)  — compute the four-state verdict (a required bot that
#     has NOT APPEARED at all past BOT_REVIEW_GATE_MAX_WAIT_H fails instead of hanging pending
#     forever — see that file's header for the live incident this fixes, #2477-adjacent), publish
#     the commit status + sticky comment.
# tally and liveness both depend only on resolve's outputs and run independently of each other —
# see each file's header for the "why a separate job" reasoning, and scripts/bot-review-gate.mjs +
# scripts/review-liveness-classify.mjs for the canonical, unit-tested logic.

on:
  workflow_call: {} # consumers call this as a reusable workflow (uses: …/bot-review-gate.yml@v1).
  # The job's `if:` keys off github.event_name (the caller's triggering event in a called workflow);
  # createCommitStatus targets context.repo — so status + auto-resolve land on the CALLER's PR.
  #
  # CALLER CONTRACT (fail-open guard): a caller MUST trigger ONLY on PR events
  #   [pull_request, pull_request_review, pull_request_review_comment, issue_comment].
  # If wired to a non-PR event (push/schedule/etc.) the job's `if:` skips, and a SKIPPED required
  # check reports as SUCCESS — silently disabling the gate (fail-open). Within the job the path is
  # already fail-closed (an unresolvable PR throws → red). Do NOT add this as a required check on a
  # caller whose triggers include non-PR events. See rules/bot-review-auto-resolve.md.
  pull_request:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: read # least privilege at the workflow level; each job escalates only what it needs

jobs:
  # Every job below carries an EXPLICIT, namespaced `name:` — none is left to default to its bare
  # job id. status-context-conformance.mjs (#1014/#1010) flags exactly two failure shapes this
  # avoids: (1) giving all four jobs the SAME name ("Bot Review Gate") would publish 4 identical
  # native check-run contexts from ONE file — a self-inflicted collision, indistinguishable from a
  # genuine cross-workflow collision to anything matching by name; (2) leaving them at their bare
  # ids (resolve/tally/liveness/verdict) collides with UNRELATED jobs elsewhere in the fleet
  # (io-resolve.yml and issue-resolve.yml both id a job `resolve`). The `Bot Review Gate / <Step>`
  # names are unique fleet-wide (checked) and are not a substring match for the bare
  # `Bot Review Gate` commit-status context, so they cannot be confused with the check that
  # actually matters externally: the CUSTOM commit status `context: 'Bot Review Gate'` published by
  # bot-review-gate-verdict.yml's own script (createCommitStatus call, unaffected by any job
  # `name:` here or anywhere in this decomposition).
  resolve:
    name: Bot Review Gate / Resolve
    uses: ./.github/workflows/bot-review-gate-resolve.yml
    permissions:
      pull-requests: write
    if: |
      github.event_name == 'pull_request' ||
      github.event_name == 'pull_request_review' ||
      github.event_name == 'pull_request_review_comment' ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request != null)

  tally:
    name: Bot Review Gate / Tally
    needs: resolve
    uses: ./.github/workflows/bot-review-gate-tally.yml
    permissions:
      pull-requests: read
    with:
      pr-number: ${{ needs.resolve.outputs.pr-number }}
      resolved-comment-ids-json: ${{ needs.resolve.outputs.resolved-comment-ids-json }}

  liveness:
    name: Bot Review Gate / Liveness
    needs: resolve
    uses: ./.github/workflows/bot-review-gate-liveness.yml
    permissions:
      pull-requests: read
      checks: read
    with:
      head-sha: ${{ needs.resolve.outputs.head-sha }}
      pr-number: ${{ needs.resolve.outputs.pr-number }}

  verdict:
    name: Bot Review Gate / Verdict
    needs: [resolve, tally, liveness]
    uses: ./.github/workflows/bot-review-gate-verdict.yml
    permissions:
      pull-requests: write
      statuses: write
    with:
      pr-number: ${{ needs.resolve.outputs.pr-number }}
      head-sha: ${{ needs.resolve.outputs.head-sha }}
      critical-count: ${{ needs.tally.outputs.critical-count }}
      major-count: ${{ needs.tally.outputs.major-count }}
      critical-source-names-json: ${{ needs.tally.outputs.critical-source-names-json }}
      major-source-names-json: ${{ needs.tally.outputs.major-source-names-json }}
      ran-bot-names-json: ${{ needs.liveness.outputs.ran-bot-names-json }}
      not-appeared-bot-names-json: ${{ needs.liveness.outputs.not-appeared-bot-names-json }}
      declined-bots-json: ${{ needs.liveness.outputs.declined-bots-json }}
      head-committed-at: ${{ needs.liveness.outputs.head-committed-at }}
