name: OpenSSF Scorecard

# Supply-chain security posture report card (branch protection, pinned deps, token perms, etc.).
# Uploads SARIF to the Security tab. Most valuable once a repo is public; harmless on private.

on:
  branch_protection_rule:
  schedule:
    - cron: "24 6 * * 1"
  push:
    branches: [master, main]

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Scorecard publishes to the public OSSF API + code scanning — only meaningful on a
    # public repo. Skip cleanly on private (no perpetual red); auto-runs once open-sourced.
    if: github.event.repository.visibility == 'public'
    permissions:
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: false
      - uses: github/codeql-action/upload-sarif@a2983b8bed1923f44751c5c43237f479442827b3 # v3.37.4
        with:
          sarif_file: results.sarif
