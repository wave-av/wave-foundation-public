name: OpenSSF Scorecard

# Supply-chain security posture report card (branch protection, pinned deps, token perms, etc.).
# Uploads SARIF to the Security tab. Most valuable once a repo is public; harmless on private.

on:
  branch_protection_rule:
  schedule:
    - cron: "24 6 * * 1"
  push:
    branches: [master, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: read-all

jobs:
  analysis:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 15
    # Scorecard publishes to the public OSSF API + code scanning — only meaningful on a
    # public repo. Skip cleanly on private (no perpetual red); auto-runs once open-sourced.
    if: github.event.repository.visibility == 'public'
    permissions:
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@4eaacf0543bb3f2c246792bd56e8cdeffafb205a # v2.4.3
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: false
      - uses: github/codeql-action/upload-sarif@7188fc363630916deb702c7fdcf4e481b751f97a # v4.37.1
        with:
          sarif_file: results.sarif
