# Semantic PR Title — enforce Conventional Commits v1.0.0 on PR titles.
# Harvested from an internal WAVE repo and genericized (runner -> ubuntu-latest). Advisory by design
# (continue-on-error) — guidance, not a merge blocker. Any WAVE repo can copy this as-is.
name: Semantic PR Title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read # least privilege at the workflow level; the job escalates only what it needs

concurrency:
  group: semantic-pr-${{ github.head_ref || github.ref }}
  # MUST stay false (#1020). `edited` fires without changing the head SHA, so a re-fire cancels a
  # run that is pinned to the SAME commit — and a `cancelled` check-run never clears. Measured on
  # PR #1042: six runs in 34 seconds, all on head 8ec8861, five cancelled. GitHub itself is fine
  # with that (required-context evaluation takes the latest, so mergeStateStatus reads CLEAN), but
  # anything asking "are there red checks on this commit?" counts `cancelled` as not-green — it
  # cannot know the cancellation was a supersede rather than a real abort — so the merge-premise
  # guard refuses the merge until someone reruns the dead run by hand.
  #
  # Narrowing the `group:` does NOT fix this, which is the non-obvious part: all six runs share one
  # head SHA, so adding the SHA to the group leaves them in the same group still cancelling
  # each other. Only not-cancelling fixes it. The group is kept so re-fires serialise instead of
  # racing; the cost is a few seconds of a title lint that had nothing worth cancelling anyway.
  cancel-in-progress: false

jobs:
  validate-title:
    name: Validate PR Title
    runs-on: blacksmith-2vcpu-ubuntu-2404
    permissions:
      contents: read # REQUIRED for actions/checkout in the parity step — a job-level permissions block
      # replaces the workflow default entirely, so without this the token has no repo access and the
      # private-repo checkout fails with "repository not found" (the parity step's long-standing break).
      pull-requests: read # the action reads the PR title
      statuses: write # ...and reports the result as a commit status
    continue-on-error: true # advisory, not blocking
    timeout-minutes: 5
    steps:
      - name: Validate conventional commit format
        uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          requireScope: false
          wip: true
          subjectPattern: ^(?![A-Z]).+$ # subject must not start with uppercase
          ignoreLabels: |
            dependencies
            bot

      # Parity gate: run the SAME validator the local commit-msg hook + pr-title-preflight use
      # (frameworks/hooks/validate-conventional-title.sh), so the rule devs hit locally is byte-for-byte
      # the rule CI enforces. If this and the amannn action above ever disagree, the rules have drifted —
      # fix the script, not just the YAML. Advisory like the rest of this workflow (continue-on-error).
      - name: Checkout (for the shared validator)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # we only need the file tree; never reuse GITHUB_TOKEN
      - name: Validate title with the shared script (parity with local hook)
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: bash frameworks/hooks/validate-conventional-title.sh "$PR_TITLE"

      - name: Check for breaking change indicator
        id: breaking
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          HAS_BREAKING=false
          if echo "$PR_TITLE" | grep -qE '^(feat|fix|refactor|perf)(\([^)]+\))?!:'; then HAS_BREAKING=true; fi
          if echo "$PR_BODY" | grep -qE '^BREAKING CHANGE:'; then HAS_BREAKING=true; fi
          echo "has_breaking=$HAS_BREAKING" >> "$GITHUB_OUTPUT"
          if [ "$HAS_BREAKING" = "true" ]; then echo "::notice::This PR contains breaking changes"; fi

      # Ambiguity Gate (advisory). Surfaces a missing gate checklist, or a hard-to-reverse /
      # public<->private-boundary box checked without a linked ADR. ADVISORY by design (DECISIONS.md
      # ADR-006 — gates are additive + advisory, never a merge block); both the job and this step set
      # continue-on-error, and the script's exit 2 is turned into a ::notice::, so it never fails the run.
      # The tree was already checked out by the parity step above. See frameworks/ambiguity-gate/README.md.
      - name: Ambiguity Gate (advisory)
        continue-on-error: true
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          if ! bash frameworks/ambiguity-gate/check-pr-ambiguity.sh "$PR_BODY"; then
            echo "::notice::Ambiguity Gate (advisory): see the step log + frameworks/ambiguity-gate/README.md"
          fi
