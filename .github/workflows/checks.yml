  verify-routes:
    # URL convention enforcement (docs/conventions/url-naming.md).
    # No-op for repos with no wrangler.toml. Scans `pattern = "..."` and `routes = [...]` lines for
    # banned patterns: *-edge.wave.online, *.production.wave.online, wave-*.wave.online,
    # *-staging.wave.online (use sub-subdomain instead). Worker-only fallbacks (*.workers.dev) are
    # ALLOWED with a warning so dev/preview routes don't trip the gate.
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true # private consumer repos need the persisted token for the v7 sparse-checkout re-fetch
      - name: URL convention gate
        # Reads only file paths from `git ls-files` (repo-controlled, trusted) and host strings
        # extracted via a CONSTRAINED regex from wrangler.toml (PR-controlled). The regex
        # `"[a-zA-Z0-9._-]+\.wave\.online[^"]*"` bounds matches between double-quotes; `cut -d/ -f1`
        # then keeps only the hostname-shaped prefix. Hostnames cannot contain shell metacharacters
        # under that character class, so the case-glob match is injection-safe. No `${{ github.* }}`
        # interpolation is used anywhere in this step (only shell vars + `-F` literal grep). Files
        # are iterated via `while read` to handle paths with spaces safely.
        run: |
          fail=0
          any=0
          # ENUMERATE FIRST, CHECK THE STATUS, THEN LOOP — see the file-size gate for the class. A
          # failed lister here printed "no wrangler.toml — verify-routes is a no-op" and exited 0,
          # which is also what a repo that genuinely has no wrangler.toml prints. The INNER loop's
          # `grep -oE` is a FILTER over a known-existing file (exit 1 = "this toml has no
          # wave.online URL", legitimate), so it is deliberately left alone.
          list=$(mktemp); trap 'rm -f "$list"' EXIT
          if ! git ls-files -- '*wrangler.toml' 'wrangler*.toml' >"$list"; then
            echo "::error::verify-routes: git ls-files FAILED — refusing to report a no-op. The gate scanned NOTHING; treat this as a blocked check, not a green one."
            exit 1
          fi
          while IFS= read -r f; do
            any=1
            # Extract host portion (everything before the first /) from `pattern = "host/..."` lines.
            # Handles both inline-string `pattern = "..."` and `routes = ["a.wave.online/*", ...]`.
            while IFS= read -r h; do
              [ -z "$h" ] && continue
              case "$h" in
                *-edge.wave.online)
                  echo "::error file=$f::URL '$h' uses banned -edge suffix (see docs/conventions/url-naming.md)"; fail=1 ;;
                *.production.wave.online)
                  echo "::error file=$f::URL '$h' uses banned .production. (production is the default)"; fail=1 ;;
                wave-*.wave.online)
                  echo "::error file=$f::URL '$h' uses banned wave- prefix (redundant on wave.online)"; fail=1 ;;
                *-staging.wave.online)
                  echo "::error file=$f::URL '$h' uses banned -staging suffix (use <proto>.staging.wave.online sub-subdomain)"; fail=1 ;;
                *.staging.wave.online)
                  echo "::notice file=$f::staging URL $h ✓" ;;
                *.dev.wave.online)
                  echo "::notice file=$f::dev URL $h ✓" ;;
                *.wave.online)
                  echo "::notice file=$f::prod URL $h ✓" ;;
                *)
                  echo "::warning file=$f::URL $h unrecognized — verify against docs/conventions/url-naming.md" ;;
              esac
            done < <(grep -oE '"[a-zA-Z0-9._-]+\.wave\.online[^"]*"' "$f" 2>/dev/null | tr -d '"' | cut -d/ -f1 | sort -u)
          done <"$list"
          if [ "$any" = 0 ]; then echo "no wrangler.toml — verify-routes is a no-op"; exit 0; fi
          if [ "$fail" = 0 ]; then echo "verify-routes passed"; fi
          exit "$fail"

  voice:
    # WAVE voice gate (frameworks/copywriting/voice-and-tone.md §human⇄agent taxonomy): user-facing
    # marketing/docs copy says "people" / second person, NOT "humans" (othering). Scans only the lines
    # ADDED by this PR, in user-facing files (.ts/.tsx/.md/.mdx, excluding tests), so it gates NEW copy
    # and never retroactively fails unswept files. That last clause was asserted here long before it was
    # true: until #1351 the check greped each changed file WHOLE, so pre-existing prose failed whoever
    # next touched it. The comment was right and the code was wrong — a documented contract is not a
    # test. ALLOWED: backticked code spans (identifiers quoted from source, e.g. an `async-human` union
    # member); the "human-in-the-loop" term-of-art (HITL —
    # an approval STEP, like "human review"; covers the "no human in the loop" autonomy idiom too); the GDPR
    # / EU-AI-Act legal terms "human review"/"human oversight"; "human-readable"; typography words;
    # identifiers/const/id-slugs; and code comments. No `${{ github.* }}` interpolation (shell only).
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true # private consumer repos need the persisted token for the v7 sparse-checkout re-fetch
          fetch-depth: 0
      - name: Voice gate (people, not humans)
        env:
          # Same base plumbing as the token-budget gate. Passed via `env:` (never `${{ }}` inline in
          # the shell) so nothing from the event payload is ever interpolated into a command.
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          # The PR's own head SHA. Used ONLY to recognise GitHub's synthetic merge commit — see the
          # base derivation below. Passed through `env:` like its siblings rather than interpolated
          # into the script body, because `${{ }}` inside `run:` is a script-injection sink.
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MERGE_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          # BASE DERIVATION — this used to be a silent fail-open with TWO independent failure modes:
          #   base=$(git remote show origin 2>/dev/null | sed -n 's/.*HEAD branch: //p')
          #   base="origin/${base:-main}"
          # (1) It is a PIPELINE, so its status is sed's — always 0. A `git remote show origin` that
          #     failed (it needs the NETWORK) silently yielded the empty string, and the `:-main`
          #     fallback then pointed at `origin/main` in repos whose default branch is not `main`.
          # (2) The diff below swallowed the resulting "unknown revision" via `2>/dev/null` inside a
          #     process substitution, so the gate printed "no changed user-facing files — voice gate
          #     is a no-op" and exited 0. That is the same string a genuinely no-op PR prints.
          # Prefer the event's own base SHA (no network, always correct for the PR being gated) and
          # fall back to the remote query only if it is absent.
          BASE_REF="${PR_BASE_SHA:-${MERGE_BASE_SHA:-$PUSH_BEFORE_SHA}}"
          # GITHUB'S SYNTHETIC PR MERGE COMMIT (claude-workstation#1605). actions/checkout resolves
          # `refs/pull/N/merge` on pull_request events — a merge of the CURRENT base branch into the
          # PR head — while PR_BASE_SHA is frozen at the base-branch tip from when the event fired.
          # Diffing that stale base against the merge commit reports every PEER commit merged in
          # between as ADDED work belonging to THIS pull request. Measured on claude-workstation
          # #1591: the voice gate failed the PR over a `human` line in a plan doc it never touched,
          # already on main from someone else's merged work, and named that author's file in the
          # annotation. It fires precisely when a branch falls behind its base, which on a busy repo
          # is minutes. The FIRST parent of that merge commit is the base-branch tip GitHub merged,
          # so it is the only base that yields the pull request's own contribution.
          #
          # The `head2 = PR_HEAD_SHA` test is load-bearing and must NEVER be relaxed to "HEAD has two
          # parents". An AUTHOR who merges the base branch into their own branch produces a head
          # whose parents mean the OPPOSITE — ^1 is their branch, ^2 is the base — so taking ^1 there
          # would report the ENTIRE base branch as added: strictly worse than the bug being fixed,
          # and this exact shape was observed live on #1591 ("Merge remote-tracking branch
          # 'origin/main' into fix/..."). Only `refs/pull/N/merge` carries the PR head as its SECOND
          # parent, so that equality is what distinguishes the two, not the parent count.
          head2="$(git rev-parse -q --verify 'HEAD^2' 2>/dev/null || true)"
          if [ -n "$PR_HEAD_SHA" ] && [ -n "$head2" ] && [ "$head2" = "$PR_HEAD_SHA" ]; then
            BASE_REF="$(git rev-parse 'HEAD^1')"
          fi
          if [ -z "$BASE_REF" ] || [ "$BASE_REF" = "0000000000000000000000000000000000000000" ]; then
            git fetch origin --quiet || true
            head_branch=$(git remote show origin | sed -n 's/.*HEAD branch: //p') || head_branch=""
            if [ -z "$head_branch" ]; then
              echo "::error::voice gate: could not resolve a diff base (no PR/merge-group/push base SHA, and 'git remote show origin' gave no HEAD branch) — refusing to report a no-op. The gate scanned NOTHING."
              exit 1
            fi
            BASE_REF="origin/$head_branch"
          fi
          # Narrow to the merge-base and diff TWO-DOT, exactly as the token-budget gate does (#930).
          mb="$(git merge-base "$BASE_REF" HEAD 2>/dev/null || true)"
          base="${mb:-$BASE_REF}"
          # Head as well as base — see the token-budget gate's note; #1605 was undiagnosable without it.
          echo "voice gate: diffing against $base (HEAD $(git rev-parse HEAD))"
          fail=0; any=0
          is_target() { case "$1" in
            *.test.*|*.spec.*) return 1 ;;
            *frameworks/copywriting/*|*voice-and-tone*) return 1 ;;
            *CHANGELOG.md) return 1 ;;   # git-cliff-generated from commit history — not authored copy
            *code-index/CATALOG.md) return 1 ;;   # code-index.mjs-generated code catalog — quotes identifiers (e.g. learning-admit's `human:` producer), not authored copy
            # claude-workstation#2109. Internal engineering plans are not marketing copy, and this
            # rule is scoped to marketing copy by its own header. `governance/plans/**` holds
            # north-star epics and phase documents whose whole job is discussing agents, reviewers
            # and operators — so "human" there is the PRECISE word, contrasted with crawler/bot, not
            # a lapse in voice. Measured on claude-workstation #1922 and #1935: both failed on an
            # added `_Status:` marker line reading "crawler vs human vs allow-listed bot". This is
            # not a vocabulary gap to patch by extending the ignore list below — that list already
            # carves out human-in-the-loop / human review / human oversight, i.e. the intent to
            # exempt technical usage is established; the defect is that the gate is scanning a
            # surface it was never meant to grade. It will recur ~43 more times as the #1218 marker
            # retrofit writes dense measurement prose into every remaining epic.
            # ANCHORED, not `*governance/plans/*`: paths from `git diff --name-status` are
            # repo-relative, so anchoring means only a REAL top-level governance tree matches. A
            # leading wildcard would also exempt `marketing/site/governance/plans/`, letting a
            # customer-facing page opt out of a copy rule by its directory name.
            # SAME RULING, TWO MORE INTERNAL TREES (claude-workstation#2847): research prose and the
            # READMEs of internal governance tooling. Measured there — 5 files, ~11 added lines — and
            # one is a VERBATIM QUOTATION (`Schulman: "human data... hard for a model to fit"`) whose
            # only in-repo remedy is to falsify it, the outcome the fenced-block carve-out below
            # exists to prevent. NAMED rather than generalized to `governance/*`, and anchored, for
            # the reasons the plans entry and the `human[-_]resources` allowlist give. The tools arm
            # is README-SPECIFIC, matching the ruling above and the measured file set exactly — a
            # bare `governance/tools/*` would exempt every .ts/.md under the tree, wider than the
            # evidence (CodeRabbit finding on the PR that added this line).
            governance/plans/*|governance/research/*|governance/tools/*/README.md) return 1 ;;
            *.tsx|*.ts|*.md|*.mdx) return 0 ;;
            *) return 1 ;;
          esac; }
          # Generated files are NOT authored copy: skip anything that self-declares as generated in
          # its first 5 lines (same invariant as the token-budget gate's AUTO-GENERATED exemption
          # above). Catalogs/indexes quote identifiers + third-party plugin descriptions verbatim
          # (first hits: code-index + capability CATALOG.md, claude-workstation#366) — the marker,
          # not the path, is the durable signal. Authored marketing never carries "Do not hand-edit".
          is_generated() { head -5 "$1" 2>/dev/null | grep -qiE 'AUTO-GENERATED|@generated|Generated by|Do not hand-edit'; }
          # ENUMERATE FIRST, CHECK THE STATUS, THEN LOOP — see the file-size gate for the class.
          # The `2>/dev/null` that used to sit on this diff is gone: it deleted the one line that
          # said WHY the gate scanned nothing.
          # `--name-status` + ACMR, not `--name-only` + ACM: rename detection reports a
          # moved-and-edited file as R, which ACM EXCLUDED — new prose written in the same commit
          # as a move was invisible to the gate. The status is needed because a rename's per-file
          # diff below must carry BOTH paths: pathspec-limiting to the new path alone drops the old
          # path from the diff's scope, rename pairing never happens, and the whole file reads as
          # added — resurrecting the #1351 whole-file class for every move. With both paths in
          # scope, a pure move contributes zero added lines and only the edits are gated.
          list=$(mktemp); trap 'rm -f "$list"' EXIT
          if ! git diff --name-status --diff-filter=ACMR "$base" HEAD >"$list"; then
            echo "::error::voice gate: git diff against '$base' FAILED — refusing to report a no-op. The gate scanned NOTHING; check that the base ref was fetched (fetch-depth: 0)."
            exit 1
          fi
          while IFS=$'\t' read -r st p1 p2; do
            [ -z "$st" ] && continue
            case "$st" in
              R*) f="$p2"; old="$p1" ;;
              *)  f="$p1"; old="" ;;
            esac
            [ -z "$f" ] && continue
            [ -f "$f" ] || continue
            is_target "$f" || continue
            is_generated "$f" && continue
            any=1
            # $f is a PR-controlled filename flowing into ::error `file=` properties below. Encode
            # it per the workflow-command PROPERTY escaping (which, beyond the %/CR/LF of message
            # data, also reserves ':' and ','), so a crafted path cannot corrupt the annotation.
            fsafe=${f//'%'/%25}; fsafe=${fsafe//$'\r'/%0D}; fsafe=${fsafe//$'\n'/%0A}
            fsafe=${fsafe//:/%3A}; fsafe=${fsafe//,/%2C}
            # ADDED LINES ONLY. Grepping the whole file attributed pre-existing prose to whoever next
            # touched it: on claude-workstation#1531 four files failed and THREE had zero occurrences
            # on any added line (#1351). The two steps below are deliberately separate because their
            # failure modes are opposite and must not be conflated:
            #   1. `git diff` failing is a BROKEN GATE -> error + non-zero, never a silent pass.
            #   2. `grep` finding nothing is the HAPPY PATH -> exit 1 that must not trip `bash -e`.
            # Collapsing both into one `... || true` pipeline is precisely the fail-open this job's
            # base-derivation comment above was written about. Do not merge them.
            dtmp=$(mktemp)
            # ${old:+"$old"} adds the rename source to the pathspec ONLY when there is one, so
            # rename pairing survives the pathspec limit (see the enumeration comment above).
            if ! git diff --unified=0 "$base" HEAD -- ${old:+"$old"} "$f" >"$dtmp"; then
              rm -f "$dtmp"
              echo "::error file=$fsafe::voice gate: git diff for this file FAILED — refusing to report a no-op. The gate scanned NOTHING for it."
              exit 1
            fi
            # The `/^@@/,$` range keeps only what follows the FIRST hunk header, where the '+++ b/…'
            # file header can no longer appear — so a content line that itself starts with '++'
            # (which the diff renders as '+++<text>', indistinguishable from the header by prefix
            # alone) survives. The previous `grep -v '^+++'` filter silently discarded that class.
            # `cut -c2-` then strips only the diff's leading '+' marker column. Backticked code spans are
            # blanked BEFORE matching, in MARKDOWN ONLY: this job's header has always promised
            # identifiers are allowed, and `async-human` / `queue-human` are members of a TypeScript
            # union quoted verbatim from source. Rewording those to satisfy a marketing rule would
            # falsify the doc. The code span is a markdown construct; in .ts/.tsx a backtick delimits
            # a TEMPLATE LITERAL, whose contents are frequently real user-facing copy — blanking
            # there would exempt exactly the strings this rule exists to gate, so source files keep
            # the raw text. An UNBALANCED backtick strips nothing (the substitution needs a closing
            # one), and fenced blocks span lines this loop sees singly — both residues fail CLOSED,
            # which is the safe direction.
            # shellcheck disable=SC2016  # the backticks are LITERAL markdown code-span delimiters, not
            # command substitution — single quotes are exactly right and must not become double quotes.
            case "$f" in *.md|*.mdx) span='s/`[^`]*`/ /g' ;; *) span='' ;; esac
            # FENCED BLOCKS are exempt in markdown, for the same reason code spans are
            # (claude-workstation#2744): their contents are QUOTED SOURCE, not authored copy.
            # Measured on the pre-fix gate, all flagged: `human: true` (yaml key),
            # `SELECT human FROM actors;`, `type Actor = human | agent;`, `actor=human tier=1`.
            # A docs PR quoting any of those got a BLOCKING red check whose only in-repo remedy
            # was to falsify the quotation.
            #
            # State is computed over the HEAD FILE, not over the added lines: a PR can add a line
            # INSIDE a fence it did not open, and added-lines-only tracking reads that line as
            # top-level prose. That case is covered by a test in the harness cited below.
            #
            # UNBALANCED FENCES DISABLE THE EXEMPTION ENTIRELY. An odd delimiter count means the
            # state machine is desynchronised, and a desynchronised exemption silently excuses
            # real marketing prose for the whole tail of a file. Exempting nothing keeps the gate
            # failing CLOSED, which is the direction this step has always chosen.
            fenced=""
            case "$f" in *.md|*.mdx)
              if [ -f "$f" ]; then
                nf=$(grep -cE '^[[:space:]]{0,3}(```|~~~)' "$f" || true)
                if [ "$nf" -gt 0 ] && [ $((nf % 2)) -eq 0 ]; then
                  fenced=$(awk '/^[[:space:]]{0,3}(```|~~~)/ { infence = !infence; print NR; next } infence { print NR }' "$f" | tr '\n' ',')
                fi
              fi
              ;;
            esac
            # No `|| true` here: this step runs WITHOUT pipefail, so the pipeline's status is the
            # final sed's — a mid-pipe grep finding nothing cannot fail it, and a sed failure is a
            # BROKEN GATE that must surface, not be forgiven.
            #
            # `fenced` is COMMA-separated, never newline-separated: `awk -v` cannot carry a newline
            # in an assignment (it dies with "awk: newline in string"), and that death emitted an
            # EMPTY added-line set, which the matcher below reads as "no violations" — a silent
            # fail-OPEN on a copy gate. Caught by the harness before this shipped, which is why the
            # `if !` guard around the assignment exists: a broken extractor must never read as clean.
            #
            # The awk replaces the old `sed -n '/^@@/,$p' | grep '^+' | cut -c2-` and preserves its
            # one subtle property: the `+++ b/…` header is skipped by only starting after the FIRST
            # `@@`, NOT by filtering `^+++` — a content line beginning with `++` renders as `+++<text>`
            # and is indistinguishable from the header by prefix alone.
            if ! added=$(awk -v fenced="$fenced" '
                  BEGIN { n = split(fenced, a, ","); for (i = 1; i <= n; i++) if (a[i] != "") skip[a[i] + 0] = 1 }
                  !seen && /^@@/ { seen = 1 }
                  !seen { next }
                  /^@@/ { split($3, h, ","); ln = substr(h[1], 2) + 0; next }
                  /^\+/ { if (!(ln in skip)) print substr($0, 2); ln++; next }
                  /^ /  { ln++; next }
                  { next }
                ' "$dtmp" | sed "$span"); then
              echo "::error file=$fsafe::voice gate: added-line extraction FAILED for this file — refusing to report a no-op. The gate scanned NOTHING for it."
              rm -f "$dtmp"
              exit 1
            fi
            rm -f "$dtmp"
            # `|| [ $? -eq 1 ]`, NOT `|| true`: the final grep exits 1 when everything was filtered
            # out, which is the HAPPY PATH and must not trip `bash -e` — but exit >1 is grep itself
            # failing, a broken gate this now propagates instead of forgiving. A blanket `|| true`
            # is the forced-success pattern gates in this repo are forbidden from carrying.
            # human[-_]resources is an ENUMERATED IDENTIFIER, not a pattern: a hyphen alone cannot
            # distinguish an identifier (human-resources, a plugin-category name) from a compound
            # ADJECTIVE (human-centered, human-first, human-scale — exactly the prose this gate
            # exists to catch). A general "human followed by -/_ " arm let all three of those
            # through silently (measured: this PR's own review) — that false negative is more
            # expensive on a copy gate than the false positive it was chasing, so widen the
            # allowlist by naming the specific known identifier rather than by generalizing the
            # pattern.
            hits=$(printf '%s\n' "$added" \
                     | grep -iE '\bhumans?\b' \
                     | grep -vE '^[[:space:]]*(//|\*|#|/\*|<!--)' \
                     | grep -ivE 'human.?in.?the.?loop|human review|human oversight|human-read|humanis|humaniz|HUMANS?_|_HUMANS?|[-_]humans?\b|human[-_]resources\b|"human"|\.human\b' || [ $? -eq 1 ])
            if [ -n "$hits" ]; then
              # Name the offending line. "this file contains 'human'" sent the reader hunting through
              # prose they did not write; the added line is attributable to its author by construction.
              # The line is PR-CONTROLLED TEXT flowing into a ::error workflow command, so escape it
              # per the workflow-command data encoding (% -> %25 first, then CR/LF). head -1 already
              # guarantees no literal newline, but a raw '%' would let crafted text decode into
              # sequences we never wrote — encode rather than trust.
              first=$(printf '%s\n' "$hits" | head -1 | cut -c1-160)
              first=${first//'%'/%25}; first=${first//$'\r'/%0D}; first=${first//$'\n'/%0A}
              echo "::error file=$fsafe::'human/humans' in NEW marketing copy — use 'people' or second person (frameworks/copywriting/voice-and-tone.md). First offending ADDED line: $first"
              fail=1
            fi
          done <"$list"
          if [ "$any" = 0 ]; then echo "no changed user-facing files — voice gate is a no-op"; exit 0; fi
          if [ "$fail" = 0 ]; then echo "voice gate passed"; fi
          exit "$fail"

  billing-contract:
    # Billing & Settlement contract gate (frameworks/billing). Validates every billing.config.yaml against
    # billing-config.schema.json + the pinned invariants — above all the CENTS INVARIANT (passthrough must be
    # "100"), the 100x-under-bill class. Schema-driven (validate-billing.py reads the consts FROM the schema),
    # so it can't disagree with the contract. No-op for repos without a billing.config.yaml. Advisory on
    # rollout (continue-on-error) so a new gate can't break every spoke at once; harden to blocking after soak.
    # The commit-time twin (registry gate) is the documented follow-up in frameworks/gates/registry.yaml.
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true # private consumer repos need the persisted token for the v7 sparse-checkout re-fetch
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.14" }
      - name: Billing & Settlement contract gate
        run: |
          python3 -m pip install --quiet pyyaml
          # Foundation runs its OWN canonical validator; spokes vendor it via consume.sh. No-op without a config.
          if [ -f frameworks/billing/validate-billing.py ]; then
            python3 frameworks/billing/validate-billing.py
          else
            echo "::notice::no frameworks/billing/validate-billing.py — run consume.sh to adopt the billing contract. Skipping."
          fi

  meter-registry:
    # Canonical-meter-registry gate (frameworks/pricing). Enforces, against the single source of record
    # meters.json: (1) MARGIN-SAFETY — every list_price_usd >= cogs_usd (a unit is never sold below the
    # dearest covered-backend cost; the money guard), and (2) SINGLE-SOURCE — the three duplicated meter
    # enums (pricing.schema.json meter + topology_meters, billing-config.schema.json name) equal the registry
    # (kills the storage_gb-vs-wave_storage_gb / voice_minutes-vs-voice_synthesis_minutes drift class).
    # Schema-driven (reads the enums, never hardcodes the list). Advisory on rollout (continue-on-error) so a
    # new gate can't break every spoke at once; harden to blocking after soak.
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true # private consumer repos need the persisted token for the v7 sparse-checkout re-fetch
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.14" }
      - name: Canonical meter-registry gate
        run: |
          python3 -m pip install --quiet pyyaml
          if [ -f frameworks/pricing/validate-meters.py ]; then
            python3 frameworks/pricing/validate-meters.py
          else
            echo "::notice::no frameworks/pricing/validate-meters.py — skipping the meter-registry gate."
          fi

  # ── SCA: dependency review (advisory) ───────────────────────────────────────
  # Software-composition analysis on PRs: flags newly-introduced dependencies with known
  # vulnerabilities or disallowed licenses, by diffing the dependency graph (base ↔ head). Inherited
  # org-wide via this reusable gate (@v1) — every consumer gets SCA on its PRs with no per-repo wiring.
  #
  # Deliberately ADVISORY (not a merge-blocker) for now: it only runs on pull_request (the action needs
  # PR base/head to diff). Both job- AND step-level `continue-on-error: true` are required to keep the
  # gate from blocking spokes that lack GitHub Advanced Security ("Dependency review is not supported
  # on this repository"). Job-level alone only stops the workflow from failing — the check-run API
  # still reports the step conclusion as FAILURE. Step-level changes the step's conclusion to SUCCESS,
  # which is what required-status-check protection actually reads. Promote per-repo by turning the
  # check into a required check only on spokes whose graph is on and signal is clean.
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true # private consumer repos need the persisted token for the v7 sparse-checkout re-fetch
      - name: Dependency review (vulns + licenses)
        continue-on-error: true
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure

  # PR body floor — the WAVE PR-description bar, enforced as a shared gate so EVERY repo and every
  # peer (agent or vendor bot) hits it. Not a style preference: measured against 50 real merged PRs
  # across five WAVE repos, the smallest solid body was 1,655
  # chars and the median was ~4.5k-8k; one-liners were 150-300. A 1,200-char floor passes every one
  # of those 50 real PRs (zero false-positives) and rejects the entire one-liner class.
  #
  # Deliberately FORMAT-AGNOSTIC: ~60% of the fleet's good PR bodies use no '##' headers at all, so
  # a header requirement would reject real work. Keyword-blocklists were also rejected after
  # measurement: "fix me" appears inside "fix merged" and "1 todo" is legit vitest output. The floor
  # is the only thing that both holds and doesn't misfire.
  #
  # Exempts bot authors (external-actor-bound-by-mechanism-not-prose: a vendor PR is a PROPOSAL — its
  # body is the vendor's record, not ours to police).
  #
  # FAIL-CLOSED BY DESIGN, deliberately NOT advisory-first. The house precedent is a trap:
  # dependency-review / billing-contract / meter-registry shipped continue-on-error:true and were
  # NEVER promoted to required checks (measured 2026-08-12 — only 'enforce'/build/secrets are
  # required anywhere) — advisory gates that never got promoted are the "present gate is not a firing
  # gate" failure from external-actor-bound-by-mechanism-not-prose corollary 1. This gate is the
  # user-facing bar for a fleet of peers, so it must actually refuse. It ships measured (50 real PRs,
  # zero false-positives) — the fleet is already clean. Fails closed on every pull_request event:
  # a NULL body (the API's shape for "no description at all") normalises to 0 chars and fails like
  # any other thin body, so the very thinnest PR cannot slip past by leaving the description empty.
  #
  # NOTE on re-runs: a `workflow_call` reusable cannot listen for `pull_request` body-edit events
  # (the CALLER's `on:` controls triggers), so a body-only fix needs a commit push or a manual
  # "Re-run". Deliberately do NOT tell callers to add `edited` to their pull_request `types:`:
  # `edited` fires at an UNCHANGED head SHA — with cancel-in-progress:true that is the rule9/#1020
  # cancelled-check-run-debris class — and review bots edit PR bodies repeatedly, so the ENTIRE
  # gate would re-run several times per PR (the rule8/wave-rig#174 double-run cost class).
  #
  # Also guards pull_request_target: a consumer whose gate runs on that event (fork PRs needing
  # secrets) would otherwise get a silently-SKIPPED pr-body job while enforce_pr_body reads true
  # (fail-open). Safe here: this job checks out nothing and runs no PR code — it only reads the
  # body/author strings via env.
  pr-body:
    if: inputs.enforce_pr_body && (github.event_name == 'pull_request' || github.event_name == 'pull_request_target')
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    steps:
      - name: PR body floor (min 1200 substantive chars, bot-authored exempt)
        run: |
          python3 - <<'PY'
          import os, re, sys
          body = os.environ.get("PR_BODY", "") or ""
          author = os.environ.get("PR_AUTHOR", "") or ""
          # Bot exemption keys on the API's own classification (user.type == "Bot" covers every
          # GitHub App) rather than login-string heuristics alone; the named logins remain for
          # approved automation identities that run as plain User accounts.
          author_type = os.environ.get("PR_AUTHOR_TYPE", "") or ""
          if author_type == "Bot" or author.endswith("[bot]") or author.lower() in ("dependabot", "renovate"):
              print("bot-authored PR — body floor exempt (external-actor-bound-by-mechanism-not-prose)")
              sys.exit(0)
          # Measure SUBSTANCE, not boilerplate. GitHub pre-fills every body with the repo's
          # pull_request_template.md (this repo's is ~1.1k chars of comments/headers/checkboxes),
          # so a raw len() would let ~40 typed chars clear the 1200 floor — and a consumer whose
          # template is >=1200 chars would get a permanently no-op gate. Strip the content-free
          # shapes templates are made of; everything the author WROTE still counts:
          #   - HTML comments (template instructions + bot markers are invisible to a reviewer).
          #     An UNCLOSED '<!--' hides everything to end-of-body in rendered markdown, so it
          #     strips to end-of-input too — otherwise 1200 invisible chars would pass.
          #   - checkbox MARKERS only ('- [x] ', '1. [ ] '): ticking a box types no prose, but
          #     the line's TEXT still counts — WAVE bodies put real verification prose on
          #     checklist lines, and the 50-PR calibration was measured raw, so discarding whole
          #     lines would risk failing checklist-heavy bodies from the measured-clean class
          #     (false positives, the one thing this gate promised not to produce). The residual
          #     template text this keeps (693 measured chars here) still rejects one-liners —
          #     but a consumer with a prose-heavy template whose residual reaches the floor gets
          #     a permanently no-op gate, so CONSUME.md makes measuring every consumer template's
          #     residual part of the pre-arming review for enforce_pr_body.
          #   - markdown header MARKERS only ('## '): heading TEXT is author-written wording and
          #     counts ('## Why: migrating off the legacy meter enum' is real content) — only the
          #     hash skeleton doesn't, and a hashes-only line drops entirely. Same false-positive
          #     reasoning as checkboxes: discarding whole heading lines (and '#'-comment lines
          #     inside fenced code blocks, which this pass cannot tell apart) would eat into the
          #     calibrated margin on heading-heavy bodies from the measured-clean class.
          #   - whitespace PADDING: runs of whitespace collapse to a single char before counting,
          #     so blank-line/space stuffing gains nothing, while normal prose (already
          #     single-spaced) keeps effectively its raw calibrated length.
          # Calibration holds: the 50 measured PR bodies are prose-heavy, so the smallest solid
          # body (1,655 raw) loses well under the ~455-char margin to the floor.
          body = re.sub(r"<!--.*?(?:-->|$)", "", body, flags=re.DOTALL)
          kept = []
          for ln in body.splitlines():
              if re.fullmatch(r"#{1,6}\s*", ln.strip()):
                  continue
              ln = re.sub(r"^\s*#{1,6}\s+", "", ln)
              kept.append(re.sub(r"^\s*(?:[-*+]|\d+[.)])\s*\[[ xX]\]\s*", "", ln))
          L = len(re.sub(r"\s+", " ", "\n".join(kept)).strip())
          if L < 1200:
              print(f"::error::PR body too thin ({L} substantive chars; floor 1200 — HTML comments, checkbox/header markers and whitespace padding don't count). A reviewer needs WHAT/WHY/verification to act cold. See the WAVE PR-body standard (wave-foundation checks.yml pr-body gate). Fix the body, then push or Re-run this check.")
              sys.exit(1)
          print(f"PR body {L} substantive chars — above the 1200 floor")
          PY
        env:
          PR_BODY: ${{ github.event.pull_request.body || '' }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_AUTHOR_TYPE: ${{ github.event.pull_request.user.type }}

  # Public-changelog gate (ADVISORY during rollout — see the changelog-standard design). The public
  # CHANGELOG.md is a surface customers read, so it must be non-empty under [Unreleased] and free of
  # internal-only references. UNIFORM for private repos: a private changelog can be mirrored public,
  # so it is written public-safe from day one.
  #
  # Advisory (continue-on-error-equivalent via exit 0): reports the standard's findings without
  # blocking the fleet mid-rollout. Promote to blocking after the measured soak — the pr-body gate
  # lesson (advisory gates that never get promoted are the "present gate is not a firing gate" trap).
  changelog:
    if: inputs.enforce_changelog && github.event_name == 'pull_request'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true # private consumer repos need the persisted token for the v7 sparse-checkout re-fetch
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
      - name: Public changelog quality + protection (advisory)
        run: |
          python3 - <<'PY'
          import os, re, sys
          path = "CHANGELOG.md"
          if not os.path.exists(path):
              print("::warning::changelog: no CHANGELOG.md — repos with a public surface need one (changelog-standard).")
              sys.exit(0)
          text = open(path, encoding="utf-8", errors="replace").read()

          # Internal-only patterns that must never appear in the PUBLIC changelog.
          internal = [
              r"\bwrangler secret put\s+\w+", r"\b[A-Z][A-Z0-9_]{2,}_AUTH_TOKEN\b",
              r"\b[A-Z][A-Z0-9_]{2,}_TOKEN\b", r"\bPAT\b", r"src/", r"\.ts\b",
              r"wrangler\.toml", r"CHANGELOG\.internal",
              r"github\.com/wave-av/[a-z-]+/(pull|issues)/\d+", r"\(#\d+\)",
              r"\bwave-av/",
          ]
          errs = []
          um = re.search(r"^## \[Unreleased\]", text, re.M)
          if not um:
              errs.append("missing ## [Unreleased] section")
          else:
              after = text[um.start():]
              body = after[after.find("]") + 1:]
              nxt = re.search(r"^## \[", body, re.M)
              unreleased = body[:nxt.start()] if nxt else body
              if not re.search(r"^### (Added|Changed|Deprecated|Removed|Fixed|Security)$", unreleased, re.M):
                  errs.append("no Keep-a-Changelog category under [Unreleased]")
              prose = re.sub(r"<!--.*?(?:-->|$)", "", unreleased, flags=re.DOTALL)
              sub = [l for l in prose.split("\n") if not re.match(r"^\s*#", l) and l.strip() and not re.match(r"^### ", l.strip())]
              if len(sub) < 1:
                  errs.append("[Unreleased] is empty — a user-facing change needs an entry")
          for pat in internal:
              m = re.search(pat, text, re.I)
              if m:
                  errs.append(f"internal-only reference in public changelog: {m.group(0).strip()[:50]}")
          for e in errs:
              print(f"::warning::changelog: {e}")
          if errs:
              print("::warning::changelog: public changelog does not meet the WAVE standard (advisory during rollout). See the changelog-standard design.")
          else:
              print("changelog: public CHANGELOG.md OK")
          sys.exit(0)  # ADVISORY — do not block during rollout; promote to exit 1 after soak.
          PY

  # CI-efficiency static gate (#3932, gha-billing-efficiency P3). Four STATIC rules over the
  # caller's own workflow YAML, zero API cost (no gh calls, no network; PyYAML only):
  #   DOUBLE-FIRE              schedule: plus push:/pull_request: on one workflow: every PR
  #                           and push pays for a workflow whose scheduled pass already
  #                           covers the tree. Split the scheduled sweep into its own file.
  #   COMMENT-FANOUT           issue_comment / pull_request_review(_comment) with no author
  #                           filter or command-prefix guard visible: any comment on any
  #                           issue or PR fires a paid run.
  #   FAST-CRON                a cron firing more than once per hour (two or more distinct
  #                           minute values in the minute field).
  #   FAST-CRON-ON-EXPENSIVE   a sub-hour cron on a GitHub-hosted paid runner (ubuntu-latest
  #                           and friends); a fast cron must use a cheap or fenced family
  #                           (blacksmith-*, depot-*, self-hosted).
  # ADVISORY ON PURPOSE: job-level continue-on-error plus the script's exit 0. The August
  # 2026 billing audit measured real existing violations fleet-wide, so a hard fail would
  # break every fleet PR at once. The flip to blocking is tracked in #3932: add --strict to
  # the invocation below (findings then print ::error:: and exit 1) and drop the
  # continue-on-error once the burn-down lands. Not fail-open silent: a missing PyYAML
  # degrades to a ::notice::, never to a quiet skip.
  # The python below is a VERBATIM twin of frameworks/gates/scripts/ci-efficiency-check.py.
  # This is a reusable workflow that runs on the CALLER's checkout, and consumer repos carry
  # no foundation scripts, so the live gate inlines the checker the same way the secret-scan
  # step does. test-ci-efficiency.sh byte-compares the twin against the canonical file, so
  # the two can never drift.
  # Scope: a pull_request checks only the workflow files the PR changed (diff against the PR
  # base; zero changed workflow files is a clean skip). Every other trigger (schedule, push,
  # dispatch, or a base that cannot be resolved) checks the whole tree, which is also the
  # scheduled-census pass. Failing open to MORE checking is the safe direction for an
  # advisory gate.
  ci-efficiency:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # PR scope diffs the changed workflow files against the PR base
          persist-credentials: true # private consumer repos need the persisted token for the v7 sparse-checkout re-fetch
      - name: CI-efficiency static check (advisory)
        run: |
          # PyYAML availability: same retry ladder as the Workflow-policy enforce step. The
          # script itself decides fail-open (advisory) vs fail-closed (strict); this preamble
          # only installs the dependency.
          for _ in 1 2 3; do
            python3 -c "import yaml" 2>/dev/null && break
            pip install --quiet --disable-pip-version-check pyyaml 2>/dev/null || true
            sleep 2
          done
          # Scope: positional args for the PR diff, none for the full-tree census. A PR with
          # zero changed workflow files is a clean skip, not a full-tree scan.
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ] && [ -n "$PR_BASE_SHA" ]; then
            MERGE_BASE="$(git merge-base "$PR_BASE_SHA" HEAD 2>/dev/null || true)"
            if [ -n "$MERGE_BASE" ]; then
              SCOPE="$(git diff --name-only "$MERGE_BASE" HEAD -- .github/workflows 2>/dev/null || true)"
              if [ -n "$SCOPE" ]; then
                # shellcheck disable=SC2086 # newline-separated paths, one path per arg is the point
                set -- $SCOPE
              else
                echo "::notice::ci-efficiency: no workflow files changed in this PR; nothing to check."
                exit 0
              fi
            fi
          fi
          python3 - "$@" <<'PY'
          #!/usr/bin/env python3
          """ci-efficiency-check.py: static CI-efficiency gate (issue #3932, gha-billing-efficiency P3).

          Four rules, all STATIC text checks over workflow YAML. Zero API cost: no gh calls, no
          network, just PyYAML over .github/workflows. The August 2026 org billing audit measured
          the waste classes these rules kill: cron spam and double-fires alone were ~$35/mo of pure
          noise, and every PR pays again for workflows whose scheduled pass already covers the tree.

            DOUBLE-FIRE              a workflow with both schedule: and push:/pull_request: triggers.
                                     Every PR and push pays for a workflow whose scheduled pass already
                                     covers the same tree. Split the scheduled sweep into its own file.
            COMMENT-FANOUT           an issue_comment / pull_request_review(_comment) trigger with no
                                     author filter or command-prefix guard visible in the file. Without
                                     a guard, ANY comment on ANY issue or PR fires a paid run.
            FAST-CRON                a cron that fires more than once per hour: two or more distinct
                                     minute values in the minute field (a '*' counts as all sixty).
                                     Sub-hour crons multiply runner cost around the clock.
            FAST-CRON-ON-EXPENSIVE   a sub-hour cron whose job runs on a GitHub-hosted paid label
                                     (ubuntu-latest and friends). A fast cron must use a cheap or
                                     fenced runner family: blacksmith-*, depot-*, self-hosted.

          MODES
            Advisory (default): findings print as ::warning:: annotations and the exit code is 0.
            A hard fail here would break every fleet PR at once on existing violations, so the gate
            ships advisory and flips to blocking only after the burn-down tracked in #3932.
            --strict: findings print as ::error:: and exit 1. The blocking flip is exactly this flag
            plus dropping the job-level continue-on-error; nothing else changes.

          USAGE
            python3 ci-efficiency-check.py [files...]     no args: every .github/workflows/*.{yml,yaml}
            python3 ci-efficiency-check.py --strict ...   exit 1 on any finding (the blocking mode)

          The live gate INLINES this file verbatim in .github/workflows/checks.yml (job
          ci-efficiency): checks.yml is a reusable workflow that runs on the CALLER's checkout, and
          consumer repos carry no foundation scripts. test-ci-efficiency.sh byte-compares the inline
          twin against this file so the two can never drift; same shape as secret-scan.sh.
          """

          import argparse
          import glob
          import re
          import sys

          try:
              import yaml
          except ImportError:
              yaml = None

          # GitHub-hosted paid labels: the expensive set for FAST-CRON-ON-EXPENSIVE. Cheap or fenced
          # families (blacksmith-*, depot-*, self-hosted, and any unrecognized label) never match:
          # the rule only fires on labels it can PROVE are GitHub-hosted, so an unknown private
          # runner pool is never a false finding.
          EXPENSIVE_RUNNER_RE = re.compile(
              r"^(ubuntu-(latest|\d{2}\.\d{2})|macos-(latest|\d+)|windows-(latest|\d{4}))$"
          )

          # Guard signals for COMMENT-FANOUT: any of these anywhere in the file counts as a visible
          # author filter or command match and suppresses the finding. Deliberately generous (raw
          # text, not only if: blocks, because a guard may sit in an env: or a with: handoff to an
          # action): the advisory gate must not cry wolf. A false negative only slows the #3932
          # burn-down; a false positive erodes trust in every warning the gate prints.
          GUARD_RES = (
              re.compile(r"github\.event\.comment\.user"),
              re.compile(r"github\.event\.review\.user"),
              re.compile(r"github\.event\.sender"),
              re.compile(r"author_association"),
              re.compile(r"github\.actor"),
              re.compile(r"github\.event\.comment\.body"),
              re.compile(r"github\.event\.review\.body"),
          )

          COMMENT_TRIGGERS = ("issue_comment", "pull_request_review", "pull_request_review_comment")
          PR_OR_PUSH_TRIGGERS = ("push", "pull_request", "pull_request_target")


          def _safe(value):
              # The live gate runs this check on the CALLER's tree, so every YAML value read here
              # (paths, job names, cron strings, runner labels) is untrusted caller content. Strip
              # CR/LF and break the command prefix before interpolating into a ::-prefixed
              # annotation line; same guard the WAS lint uses (checks.yml, #890).
              return str(value).replace("\r", " ").replace("\n", " ").replace("::", ":​:")


          def expand_field(field, lo, hi):
              """Expand one cron field to the set of integers it matches, or None if unparseable.

              Handles the shapes GitHub crons use: '*' (with optional /N step), 'A-B' (with optional
              /N), bare 'A', comma lists, and vixie-style 'A/N' (A to the field top, every N).
              """
              values = set()
              for part in str(field).split(","):
                  part = part.strip()
                  if not part:
                      return None
                  step = 1
                  had_step = False
                  if "/" in part:
                      base, _, step_text = part.partition("/")
                      part = base
                      had_step = True
                      try:
                          step = int(step_text)
                      except ValueError:
                          return None
                      if step < 1:
                          return None
                  if part == "*":
                      start, end = lo, hi
                  elif "-" in part:
                      a, _, b = part.partition("-")
                      try:
                          start, end = int(a), int(b)
                      except ValueError:
                          return None
                  else:
                      try:
                          start = int(part)
                      except ValueError:
                          return None
                      end = hi if had_step else start
                  if start > end:
                      return None
                  values.update(range(start, end + 1, step))
              return values


          def cron_minutes(cron):
              """Return the set of minute values a 5-field cron matches, or None if unparseable."""
              fields = str(cron).split()
              if len(fields) != 5:
                  return None
              return expand_field(fields[0], 0, 59)


          def check_file(path):
              """Return the findings for one workflow file as a list of (rule, message) pairs."""
              findings = []
              if yaml is None:
                  # Self-contained guard: main() already refuses to run without PyYAML, but this
                  # function stays independently safe (and type-clean) if called directly.
                  print("::notice::ci-efficiency: PyYAML unavailable; cannot check workflow files.")
                  return findings
              try:
                  with open(path, encoding="utf-8", errors="replace") as fh:
                      text = fh.read()
              except OSError as exc:
                  print(f"::notice::ci-efficiency: cannot read {_safe(path)} ({exc}); skipping")
                  return findings
              try:
                  doc = yaml.safe_load(text)
              except Exception as exc:
                  print(f"::notice::ci-efficiency: {_safe(path)} unparseable ({exc}); skipping")
                  return findings
              if not isinstance(doc, dict):
                  return findings

              # YAML 1.1 parses a bare on: key as boolean True; same dance the WAS lint does.
              on = doc.get("on", doc.get(True, {}))
              if isinstance(on, str):
                  on = {on: None}
              elif isinstance(on, list):
                  on = {k: None for k in on}
              if not isinstance(on, dict):
                  on = {}

              # DOUBLE-FIRE: schedule: plus push:/pull_request: on one workflow.
              fired = sorted(t for t in PR_OR_PUSH_TRIGGERS if t in on)
              if "schedule" in on and fired:
                  findings.append((
                      "DOUBLE-FIRE",
                      f"has both schedule: and {'/'.join(fired)}: triggers; every PR or push pays "
                      "for a workflow whose scheduled pass already covers the tree. Split the "
                      "scheduled sweep into its own workflow file.",
                  ))

              # FAST-CRON: any schedule entry that fires more than once per hour. Two or more
              # distinct minute values always yield a sub-hour gap; a single minute value never
              # does (the worst case is exactly hourly).
              sched = on.get("schedule")
              entries = sched if isinstance(sched, list) else [sched] if isinstance(sched, dict) else []
              fast = False
              for entry in entries:
                  if not isinstance(entry, dict):
                      continue
                  cron = entry.get("cron")
                  if cron is None:
                      continue
                  minutes = cron_minutes(cron)
                  if minutes is None:
                      print(f"ci-efficiency: {_safe(path)}: cron '{_safe(cron)}' unparseable; skipping it")
                      continue
                  if len(minutes) >= 2:
                      fast = True
                      findings.append((
                          "FAST-CRON",
                          f"cron '{_safe(cron)}' fires more than once per hour; sub-hour crons "
                          "multiply runner cost around the clock. Keep the interval at 60 minutes "
                          "or slower.",
                      ))

              # FAST-CRON-ON-EXPENSIVE: a sub-hour cron whose job sits on a GitHub-hosted paid
              # label. One finding per offending job; expression-valued runs-on labels cannot be
              # resolved statically and are skipped.
              if fast:
                  for job_name, job in (doc.get("jobs") or {}).items():
                      if not isinstance(job, dict):
                          continue
                      runs_on = job.get("runs-on")
                      if runs_on is None:
                          continue
                      labels = runs_on if isinstance(runs_on, list) else [runs_on]
                      for label in labels:
                          label = str(label)
                          if "{{" in label:
                              continue
                          if EXPENSIVE_RUNNER_RE.match(label):
                              findings.append((
                                  "FAST-CRON-ON-EXPENSIVE",
                                  f"sub-hour cron on GitHub-hosted runner '{_safe(label)}' (job "
                                  f"'{_safe(job_name)}'); a fast cron must use a cheap or fenced "
                                  "runner family: blacksmith-*, depot-*, or self-hosted.",
                              ))
                              break

              # COMMENT-FANOUT: a comment-shaped trigger with no visible guard.
              comment_events = sorted(t for t in COMMENT_TRIGGERS if t in on)
              if comment_events and not any(rx.search(text) for rx in GUARD_RES):
                  findings.append((
                      "COMMENT-FANOUT",
                      f"{', '.join(comment_events)} trigger with no author filter or command-prefix "
                      "guard visible in the file; any comment on any issue or PR fires a paid run. "
                      "Add an if: on the sender or author, or match a command prefix (the pr-agent "
                      "cost-abuse gate in wave-foundation is the house pattern).",
                  ))

              return findings


          def main(argv=None):
              parser = argparse.ArgumentParser(
                  description="Static CI-efficiency gate: double-fire, comment-fanout, fast-cron "
                  "and fast-cron-on-expensive checks over GitHub workflow YAML (#3932)."
              )
              parser.add_argument(
                  "files",
                  nargs="*",
                  help="workflow files to check; with no args, every .github/workflows/*.{yml,yaml}",
              )
              parser.add_argument(
                  "--strict",
                  action="store_true",
                  help="exit 1 on any finding (the future blocking mode after the #3932 burn-down)",
              )
              args = parser.parse_args(argv)

              if yaml is None:
                  # Advisory mode fails OPEN (a missing dependency must never wedge a caller's PR);
                  # strict mode fails CLOSED (the blocking flip must not fail silent).
                  mode = "strict" if args.strict else "advisory"
                  print(f"::notice::ci-efficiency: PyYAML unavailable; cannot check workflows in {mode} mode.")
                  return 1 if args.strict else 0

              if args.files:
                  paths = list(args.files)
              else:
                  paths = sorted(
                      glob.glob(".github/workflows/*.yml") + glob.glob(".github/workflows/*.yaml")
                  )

              level = "error" if args.strict else "warning"
              total = 0
              for path in paths:
                  for rule, message in check_file(path):
                      print(f"::{level}::ci-efficiency[{rule}] {_safe(path)}: {message}")
                      total += 1
              mode = "strict" if args.strict else "advisory: warnings only, the gate stays green"
              print(f"ci-efficiency: scanned {len(paths)} workflow file(s), {total} finding(s) ({mode})")
              if total and args.strict:
                  return 1
              return 0


          if __name__ == "__main__":
              sys.exit(main())
          PY
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
