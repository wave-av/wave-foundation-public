# pr-agent (OSS) — wave-foundation's OWN caller for its OWN reusable lane.
#
# THIS FILE WAS AN INLINE COPY AND IT DRIFTED. That is the defect this file fixes.
# It claimed to "mirror" reusable-pr-agent.yml, and then three merged fixes to the
# reusable never reached it: cc6a4b98 (bounded retry + neutral verdict), ed47221e
# (honest failure classification), 32af9cef (per-attempt 6-minute step budget,
# CONFIG__AI_TIMEOUT 600 -> 300, fork gate). A copy that has to be hand-synced is a
# copy that will be out of sync; measured here, it was, for three commits.
#
# Receipt (run 32858945160, PR head fix/canon-dark-dim, 2026-08-25): the job ran 919s
# against `timeout-minutes: 15` and GitHub rendered it `cancelled`. Its step list was
# only [Set up job / Build pr-agent@f6af7d77 / PR-Agent (OSS qodo-merge) cancelled 889s
# / Complete job] — no fork gate, no attempt stamps, no retry, no verdict. No run
# started on that branch inside the cancel window, so nothing evicted it: it was the
# job ceiling. The inline copy had no per-attempt step budget, so one slow router call
# with auto_review + auto_improve both on ate the entire 15 minutes, and the retry the
# reusable added was never there to fire.
#
# The original comment here said a self-reference to our own reusable is "unpinnable"
# and chose inlining to avoid it. That trades one problem for a worse one. The LOCAL
# PATH form below (`uses: ./.github/workflows/...`) needs no pin *because* it is not
# pinnable: GitHub always resolves it to the same commit as this caller. There is no
# version to drift, no SHA to bump, and no second copy of the gate logic to keep
# honest. Pinning matters for THIRD-PARTY workflows (the action inside the reusable is
# still SHA-pinned); it is meaningless for a file in this same tree.
#
# Every safety property is preserved and now lives in exactly one place — the
# reusable's job-level `if:` plus its fork-gate step:
#   - issue_comment: requires issue.pull_request, `startsWith(comment.body, '/')`, and
#     author_association in [MEMBER, OWNER, COLLABORATOR]  (cost-abuse gate)
#   - pull_request:  requires !contains(user.login, '[bot]'), draft == false, and
#     head.repo.fork == false                              (fork + bot + draft gates)
#   - plus a fork-gate STEP the `if:` structurally cannot express on the issue_comment
#     arm, because that payload does not carry fork status (private-repo#418).
# The reusable is STRICTLY stricter than the inline copy this replaces, which had no
# fork-gate step at all.
name: pr-agent (OSS)

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  issue_comment:
    types: [created]

permissions:
  issues: write
  pull-requests: write
  contents: read

# Concurrency is evaluated at WORKFLOW level, before any job `if:` — so a run that
# the reusable lane would skip has already entered this group and evicted whatever
# was in it. PRs and Issues also share ONE number sequence. The group therefore
# needs both discriminators, and neither is redundant:
#   - `event_name` keeps a push-triggered `pull_request` review from being
#     cancelled by an `issue_comment` on the same PR.
#   - the `pr`/`issue` kind keeps `issue_comment` on PR #30 from colliding with
#     `issue_comment` on Issue #30, which `event_name` alone does not separate.
# Measured fleet-wide: 118 of 137 callers carried the undiscriminated key
# (private-repo#386, #420).
#
# `cancel-in-progress: true` is DELIBERATELY LEFT AS-IS here and is a live question,
# not a settled one — see docs/PR-AGENT-LANE-FINDING.md. On a fast-pushing agent PR it
# can evict a review that would have finished. It is not changed in this PR because
# narrowing it trades away per-commit review coverage, and that is a product call for
# the repo owner rather than a drift fix. wave-foundation's own numbers do not force
# it: of 4 cancelled pull_request runs in the last 100, the one long enough to matter
# was the job-timeout above, and no cancel had an identifiable same-branch evictor.
concurrency:
  group: pr-agent-${{ github.event_name }}-${{ (github.event.pull_request.number || github.event.issue.pull_request) && 'pr' || 'issue' }}-${{ github.event.pull_request.number || github.event.issue.number || github.ref }}
  cancel-in-progress: true

jobs:
  pr_agent:
    # Local path: always the same commit as this caller. Drift is now structurally
    # impossible rather than a thing someone has to remember.
    uses: ./.github/workflows/reusable-pr-agent.yml
    secrets:
      OPENAI_KEY: ${{ secrets.OPENAI_KEY }}
